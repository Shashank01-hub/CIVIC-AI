name: CD
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with: {context: ./backend, push: true, tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-city-backend:latest}
      - uses: docker/build-push-action@v6
        with: {context: ./frontend, push: true, tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-city-frontend:latest}
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: cd /opt/smart-city && docker compose pull && docker compose up -d
